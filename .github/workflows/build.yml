name: Build Yamtrack

on:
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.manifest.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Check the app version
        id: manifest
        shell: bash
        run: |
          version=$(jq -er '.version | strings' app/appinfo.json)
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::app/appinfo.json must specify an X.Y.Z version."
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::The Git tag must match the app manifest version (v$version)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
          node --test tests/test_*.js

      - name: Build and verify the webOS package
        run: |
          python scripts/build.py
          cd dist
          sha256sum --check -- *.ipk.sha256

      - name: Upload webOS artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: yamtrack-webos-${{ steps.manifest.outputs.version }}
          path: |
            dist/*.ipk
            dist/*.ipk.sha256
            dist/*.tgz
          if-no-files-found: error

  test-image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
          - platform: linux/arm64
            emulator: arm64
          - platform: linux/arm/v7
            emulator: arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up ARM emulation
        if: matrix.emulator != ''
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: ${{ matrix.emulator }}
      - name: Build and smoke-test the helper image
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker build --platform "$PLATFORM" --tag yamtrack-helper:ci .
          docker run --platform "$PLATFORM" --detach --rm --name yamtrack-helper-ci \
            --publish 127.0.0.1:8765:8765 \
            --env YAMTRACK_URL=http://yamtrack.test:8000 \
            --env TV_PUBLIC_URL=http://127.0.0.1:8765 yamtrack-helper:ci
          trap 'docker rm --force yamtrack-helper-ci >/dev/null 2>&1 || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused \
            --retry-delay 1 --max-time 5 http://127.0.0.1:8765/__tv/ >/dev/null

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, test-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for an existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if release=$(gh release view "$GITHUB_REF_NAME" --json isDraft,assets 2>/dev/null); then
            app_id=$(jq -er '.id | strings' app/appinfo.json)
            ipk="${app_id}_${VERSION}_all.ipk"
            if ! jq -e --arg ipk "$ipk" --arg bundle "yamtrack-tv-$VERSION.tgz" \
              '[.assets[].name] as $names | (.isDraft | not) and ([$ipk, ($ipk + ".sha256"), $bundle] - $names == [])' \
              <<< "$release" >/dev/null; then
              echo "::error::The GitHub release already exists without all published assets."
              exit 1
            fi
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download the tested webOS artifacts
        if: steps.release.outputs.published != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: yamtrack-webos-${{ env.VERSION }}
          path: dist
      - name: Set up ARM emulation
        if: steps.release.outputs.published != 'true'
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64,arm
      - name: Publish the helper image
        if: steps.release.outputs.published != 'true'
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx create --driver docker-container --use
          docker buildx build --platform linux/amd64,linux/arm64,linux/arm/v7 --push \
            --tag "$image" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
      - name: Publish the GitHub release
        if: steps.release.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: dist
        run: |
          sha256sum --check -- *.ipk.sha256
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            *.ipk *.ipk.sha256 *.tgz
